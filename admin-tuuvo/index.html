<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>TUUVO — Administração TUUVO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="brand"><strong>TUUVO</strong></div>
      <p class="login-subtitle">Administração TUUVO — acesso do time interno.</p>
      <form id="login-form">
        <div class="field"><label>E-mail</label><input type="email" id="login-email" required /></div>
        <div class="field"><label>Senha</label><input type="password" id="login-senha" required /></div>
        <div id="login-error" class="login-error" hidden></div>
        <button type="submit" class="btn btn-block">Entrar</button>
      </form>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <div class="sidebar">
      <div class="brand"><strong>TUUVO</strong></div>
      <div class="brand-sub">Administração TUUVO</div>
      <div class="nav-item" data-route="dashboard">📊 Dashboard</div>
      <div class="nav-item" data-route="tenants">🏢 Tenants</div>
      <div class="nav-item" data-route="planos">💳 Planos</div>
      <div class="nav-item" data-route="providers">🔌 Credenciais de canal</div>
      <div class="nav-item" data-route="usuarios">👥 Time TUUVO</div>
      <div class="sidebar-footer">
        <div id="current-user"></div>
        <button id="logout-btn" class="link-btn">Sair</button>
      </div>
    </div>
    <div class="main" id="main-content"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
